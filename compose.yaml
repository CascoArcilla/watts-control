services:
  ec-app-api:
    build: ./backend/
    container_name: ec-app-api
    env_file:
      - .env
    ports:
      - "9200:5000"
    develop:
      watch:
        - path: ./backend
          action: rebuild
    networks:
      - net-ec-sys
    depends_on:
      ec-db-postgres:
        condition: service_healthy

  ec-app-frontend:
    build:
      context: ./frontend/
    container_name: ec-app-frontend
    ports:
      - "9300:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    develop:
      watch:
        - path: ./frontend
          action: rebuild
    depends_on:
      ec-app-api:
        condition: service_started
    networks:
      - net-ec-sys

  ec-db-postgres:
    image: postgres:latest
    restart: always
    container_name: ec-db-postgres
    volumes:
      - db-control-postgres:/var/lib/postgresql
      - ./docker/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    environment:
      - POSTGRES_PASSWORD=${EC_DB_PASSWORD}
      - POSTGRES_USER=${EC_DB_USER}
      - POSTGRES_DB=${EC_DB_NAME}
    ports:
      - "9100:${EC_DB_PORT}"
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "${EC_DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      net-ec-sys:
        aliases:
          - postgres-container

networks:
  net-ec-sys:
    driver: bridge

volumes:
  db-control-postgres: